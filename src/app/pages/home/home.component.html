<section class="home-container">
    <section class="hero-section">
        <div class="hero-content">
            <h1>Bem-vindo à Livraria Prisma</h1>
            <p>Descubra histórias incríveis, clássicos inesquecíveis e grandes aventuras literárias.</p>
        </div>
    </section>
<!-- Seção de Destaques em Carrossel -->
  <section class="destaques-section">
    <div class="section-header">
      <h2>Destaques da Leitura</h2>
    </div>

    <div class="carrossel-container">
      <button class="carrossel-btn btn-prev" (click)="rolarCarrossel(-1)">&#10094;</button>
      
      <div class="carrossel-wrapper">
        <div class="livros-carrossel" #carrossel>
            
    <!-- Container principal do Carrossel -->
    <div class="carrossel-wrapper">
      <div class="livros-carrossel">
        
        <!-- Livro 1 -->
        <div class="livro-card">
          <div class="livro-imagem-wrapper">
            <img src="img/senhor-dos-aneis.jpg" alt="Senhor Dos Anéis">
          </div>
          <div class="livro-info">
            <h3 class="livro-titulo">Senhor Dos Anéis</h3>
            <p class="livro-autor">J.R.R. Tolkien</p>

            <button class="btn-comprar">Comprar</button>
          </div>
        </div>

        <!-- Livro 2 -->
        <div class="livro-card">
          <div class="livro-imagem-wrapper">
            <img src="img/1984.jpg" alt="1984">
          </div>
          <div class="livro-info">
            <h3 class="livro-titulo">1984</h3>
            <p class="livro-autor">George Orwell</p>
            <button class="btn-comprar">Comprar</button>
          </div>
        </div>

        <!-- Livro 3 -->
        <div class="livro-card">
          <div class="livro-imagem-wrapper">
            <img src="img/dom-casmurro.jpg" alt="Dom Casmurro">
          </div>
          <div class="livro-info">
            <h3 class="livro-titulo">Dom Casmurro</h3>
            <p class="livro-autor">Machado de Assis</p>
            <button class="btn-comprar">Comprar</button>
          </div>
        </div>

        <!-- Livro 4 (Extra para demonstrar o carrossel deslizando) -->
        <div class="livro-card">
          <div class="livro-imagem-wrapper">
            <img src="img/O-Pequeno-Principe.jpg" alt="O Pequeno Príncipe">
          </div>
          <div class="livro-info">
            <h3 class="livro-titulo">O Pequeno Príncipe</h3>
            <p class="livro-autor">Antoine de Saint-Exupéry</p>
            <button class="btn-comprar">Comprar</button>
          </div>
        </div>

      </div>
    </div>
  </section>
</section>
