<div class="home-container">

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Bem-vindo à Livraria Prisma</h1>
      <p>Descobre histórias incríveis, clássicos inesquecíveis e grandes aventuras literárias.</p>
    </div>
  </section>

  <!-- Secção de Destaques em Carrossel -->
  <section class="destaques-section">
    <div class="section-header">
      <h2>Destaques da Leitura</h2>
      <span class="sub-titulo">Os favoritos dos nossos leitores</span>
    </div>

    <!-- Carrossel com Setas -->
    <div class="carrossel-container">
      <button type="button" class="carrossel-btn btn-prev" (click)="rolarCarrossel(-1)" aria-label="Anterior">
        &#10094;
      </button>

      <div class="carrossel-wrapper">
        <div class="livros-carrossel" #carrossel>

         <div class="livro-card" *ngFor="let livro of livros">
            <div class="livro-imagem-wrapper">
              <img [src]="livro.capa" [alt]="livro.titulo">
            </div>

            <div class="livro-info">
              <h3 class="livro-titulo">{{ livro.titulo }}</h3>
              <p class="livro-autor">{{ livro.autor }}</p>
              <span class="livro-preco">R$ {{ livro.preco }}</span>
                <button type="button" class="btn-comprar" (click)="comprarLivro(livro)">Comprar</button>
            </div>
          </div>

        </div>
      </div>

      <button type="button" class="carrossel-btn btn-next" (click)="rolarCarrossel(1)" aria-label="Seguinte">
        &#10095;
      </button>
    </div>
  </section>

</div>
