<body>
    <section class="divTotal">



        <form [formGroup]="form" ngSubmit()="onSubmit()">



            <div class="divLogin">
                <h2>{{isLoginMode ? 'Login' : 'Cadastro'}}</h2>

                <label for="email">Email: </label>
                <input id="email" type="email" formControlName="email">

                <label for="password">Senha: </label>
                <input id="password" type="password" formControlName="password" [placeholder]="isLoginMode ? '' : 'Informe pelo menos 6 digitos'">

                <div class="divButtons">
                    <button type="button" class="buttonLogin" (click)="onSubmit()">
                        {{isLoginMode ? 'Entrar' : 'Cadastrar'}}
                    </button>
                    <button type="button" class="buttonCadastro" (click)="toggleMode()">
                        {{isLoginMode ? 'Cadastrar-se' : 'Voltar ao Login'}}
                    </button>
                </div>

            </div>
        </form>
    </section>
</body>
