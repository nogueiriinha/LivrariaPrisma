<div class="cadastro">

  <div class="cadastro-header">
    <span class="badge">Livraria Prisma</span>
    <h1>Crie a sua conta</h1>
    <p>Preencha seus dados abaixo para começar sua jornada literária</p>
  </div>

  <form (ngSubmit)="cadastrar()">

    <div class="form-row">
      <div class="form-group">
        <label>Nome</label>
        <input type="text" [(ngModel)]="nome" name="nome" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label>Sobrenome</label>
        <input type="text" [(ngModel)]="sobrenome" name="sobrenome" placeholder="Seu sobrenome">
      </div>
    </div>

    <div class="form-group">
      <label>E-mail</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="exemplo@email.com">
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input type="tel" [(ngModel)]="telefone" name="telefone" placeholder="(11) 99999-9999">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>CPF</label>
        <input type="text" [(ngModel)]="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14">
      </div>

      <div class="form-group">
        <label>Data de Nascimento</label>
        <input type="date" [(ngModel)]="dataNascimento" name="dataNascimento">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Senha</label>
        <input type="password" [(ngModel)]="senha" name="senha" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label>Confirmar senha</label>
        <input type="password" [(ngModel)]="confirmarSenha" name="confirmarSenha" placeholder="••••••••">
      </div>
    </div>

    @if (mensagem) {
      <p class="mensagem" [class.sucesso]="mensagem.includes('sucesso')">{{ mensagem }}</p>
    }

    <div class="form-actions">
      <button type="submit">Criar conta</button>
      <button type="button" (click)="voltar()">Voltar</button>
    </div>

  </form>

</div>
