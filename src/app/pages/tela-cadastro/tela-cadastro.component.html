<!DOCTYPE html>
<html lang="PT-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Cadastro</title>
</head>

<body>

  <div class="cadastro">

    <h1>Crie a sua conta</h1>
    <p>Preencha seus dados para criar a conta</p>

    <form (ngSubmit)="cadastrar()">

      <label>Nome</label>
      <input type="text" [(ngModel)]="nome" name="nome" placeholder="Digite seu nome">

      <label>E-mail</label>
      <input type="email" [(ngModel)]="email" name="email" placeholder="Digite seu e-mail">

      <label>Telefone</label>
      <input type="tel" [(ngModel)]="telefone" name="telefone" placeholder="Digite seu telefone">

      <label>Senha</label>
      <input type="password" [(ngModel)]="senha" name="senha" placeholder="Digite sua senha">

      <label>Confirmar senha</label>
      <input type="password" [(ngModel)]="confirmarSenha" name="confirmarSenha"
        placeholder="Digite sua senha novamente">

      @if (mensagem) {
      <p class="mensagem">{{ mensagem }}</p>
      }

      <button type="submit">Criar conta</button>
      <button type="button" (click)="voltar()">Voltar</button>

    </form>

  </div>

</body>

</html>
