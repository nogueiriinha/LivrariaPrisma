<div class="content-container">
  <h2>{{ produtoId ? 'Editar Livro' : 'Cadastrar Novo Livro' }}</h2>

  <form (ngSubmit)="salvar()" #form="ngForm">
    <div class="form-group">
      <label for="nome">Título da Obra:</label>
      <input 
        id="nome" 
        name="nome" 
        class="input-simples" 
        type="text" 
        placeholder="Ex: Dom Quixote" 
        [(ngModel)]="produto.titulo" 
        required>
    </div>

    <div class="form-group">
      <label for="autor">Autor:</label>
      <input 
        id="autor" 
        name="autor" 
        class="input-simples" 
        type="text" 
        placeholder="Ex: Miguel de Cervantes" 
        [(ngModel)]="produto.autor" 
        required>
    </div>

    <div class="form-group">
      <label for="preco">Preço (R$):</label>
      <input 
        id="preco" 
        name="preco" 
        class="input-simples" 
        type="number" 
        step="0.01" 
        [(ngModel)]="produto.preco" 
        required>
    </div>

    <div class="form-group">
      <label for="estoque">Quantidade em Estoque:</label>
      <input 
        id="estoque" 
        name="estoque" 
        class="input-simples" 
        type="number" 
        [(ngModel)]="produto.estoque" 
        required>
    </div>

    <div class="form-group">
      <label for="capa">URL da Capa (Imagem):</label>
      <input 
        id="capa" 
        name="capa" 
        class="input-simples" 
        type="url" 
        placeholder="https://exemplo.com/capa.jpg" 
        [(ngModel)]="produto.capa" 
        required>
      
      <!-- Pré-visualização automática da capa no formulário -->
      <div *ngIf="produto.capa" style="margin-top: 12px; text-align: center;">
        <img [src]="produto.capa" alt="Prévia da capa" style="max-height: 140px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
      </div>
    </div>

    <div class="acoes">
      <button type="submit" class="input-submeter" [disabled]="form.invalid">
        {{ produtoId ? 'Salvar Alterações' : 'Cadastrar' }}
      </button>
      <button type="button" class="btn-cancelar" (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </form>
</div>
