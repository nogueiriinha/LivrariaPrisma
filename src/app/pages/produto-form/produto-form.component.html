<div class="content-container">
  <h2>{{ produtoId ? 'Editar Livro' : 'Cadastrar Novo Livro' }}</h2>

  <form (ngSubmit)="salvar()" #form="ngForm">
    <div class="form-group">
      <label for="nome">Título da Obra:</label>
      <input 
        id="nome" 
        name="nome" 
        class="input-simples" 
        type="text" 
        placeholder="Ex: Dom Quixote" 
        [(ngModel)]="produto.titulo" 
        required>
    </div>

    <div class="form-group">
      <label for="autor">Autor:</label>
      <input 
        id="autor" 
        name="autor" 
        class="input-simples" 
        type="text" 
        placeholder="Ex: Miguel de Cervantes" 
        [(ngModel)]="produto.autor" 
        required>
    </div>

    <div class="form-group">
      <label for="preco">Preço (R$):</label>
      <input 
        id="preco" 
        name="preco" 
        class="input-simples" 
        type="number" 
        step="0.01" 
        [(ngModel)]="produto.preco" 
        required>
    </div>

    <div class="form-group">
      <label for="qtd">Quantidade em Estoque:</label>
      <input 
        id="estoque" 
        name="estoque" 
        class="input-simples" 
        type="number" 
        [(ngModel)]="produto.estoque" 
        required>
    </div>

    <div class="acoes">
      <button type="submit" class="input-submeter" [disabled]="form.invalid">
        {{ produtoId ? 'Salvar Alterações' : 'Cadastrar' }}
      </button>
      <button type="button" class="btn-cancelar" (click)="cancelar()">
        Cancelar
      </button>
    </div>
  </form>
</div>
